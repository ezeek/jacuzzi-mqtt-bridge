version: '3.8'

services:
  jacuzzi-mqtt-bridge:
    build: .
    container_name: jacuzzi-mqtt-bridge
    restart: unless-stopped
    environment:
      - JACUZZI_IP=
      - JACUZZI_PORT=4257
      - MQTT_BROKER=
      - MQTT_PORT=1883
      # IMPORTANT: Set your MQTT credentials if your broker requires authentication
      # Leave empty for anonymous access
      - MQTT_USERNAME=
      - MQTT_PASSWORD=
      - MQTT_CLIENT_ID=jacuzzi-mqtt-bridge
      - MQTT_DISCOVERY_PREFIX=homeassistant
      - MQTT_BASE_TOPIC=jacuzzi
      # Set to DEBUG to see detailed MQTT connection info
      - LOG_LEVEL=INFO
      # Auto-reconnect on read failures
      - READFAIL_RESTART_ENABLE=1
      - READFAIL_RESTART_COUNT=3    # Restart after 3 read fails
      - READFAIL_WINDOW_S=5          # Within 5 second window
    network_mode: host
    # Optional: Add healthcheck
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f mqtt_bridge.py || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
